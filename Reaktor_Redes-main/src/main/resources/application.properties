# Desactiva la auto-configuración de seguridad de Spring Boot solo en este módulo
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
# Server Configuration
server.port=8084

# Application Name
spring.application.name=Reaktor-Redes

# Logging
logging.level.root=INFO
logging.level.Reaktor_redes_main=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/reaktor_redes?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=toor
spring.jpa.hibernate.ddl-auto=update